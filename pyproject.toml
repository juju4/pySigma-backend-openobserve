[project]
name = "pySigma-backend-openobserve"
version = "0.1.0"
description = "pySigma openobserve backend"
readme = "README.md"
requires-python = ">=3.10,<3.15"
authors = [
    { name = "juju4" }
]
license = "LGPL-3.0-only"
classifiers = [
    "Programming Language :: Python :: 3",
]

dependencies = [
    "pysigma>=1.4.0",
    "python_openobserve>=0.5.2",
]

[tool.poetry]
packages = [
    { include = "sigma" }
]

[tool.poetry.group.dev.dependencies]
black = "26.5.1"
pytest = "9.1.1"
pytest-cov = "7.1.0"
coverage = "7.16.0"


[tool.pdm]
[tool.pdm.dev-dependencies]
dev = []

[tool.pdm.build]
includes = ["sigma"]
[build-system]
requires = ["poetry-core>=1.8.1"]
build-backend = "poetry.core.masonry.api"

[project.urls]
Repository = "https://github.com/juju4/pySigma-backend-openobserve"

[project.group.dev.dependencies]
pytest = "^8.0"
pytest-cov = "^4.1"
coverage = "^7.4"
